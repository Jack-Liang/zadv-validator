name: "abaplint"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  abaplint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: abaplint/actions-abaplint@main
        with:
          configFile: abaplint.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
